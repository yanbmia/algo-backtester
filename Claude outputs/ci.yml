name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Pinned to the version used locally, so a new ruff release can't turn a
      # finished project red with new rules or formatting changes.
      - name: Install ruff
        run: pip install "ruff==0.16.9"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .

  test:
    name: test (py${{ matrix.python-version }}, pandas ${{ matrix.pandas }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python with the oldest supported pandas (pyproject: pandas>=2.2).
          - python-version: "3.11"
            pandas: "2.2"
          - python-version: "3.11"
            pandas: "3.0"
          # The setup that produced the committed reports (see reports/sma_spy_run.json).
          - python-version: "3.14"
            pandas: "3.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # The notebook extra lets tests/test_notebook.py execute the notebook
        # instead of skipping.
        run: pip install -e ".[dev,notebook]" "pandas~=${{ matrix.pandas }}.0"
      - name: Versions
        run: python -c "import sys, numpy, pandas; print(sys.version); print('pandas', pandas.__version__, '| numpy', numpy.__version__)"
      - name: Test (offline only; tests marked network call the live Yahoo API)
        run: pytest -m "not network"
