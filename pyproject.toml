[project]
name = "algo-backtester"
version = "0.1.0"
description = "A lookahead-safe daily backtester for classical and ML trading strategies."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# Tests that hit the live yfinance API are deselected by default so the suite is
# deterministic and runs offline. Run them explicitly with: pytest -m network
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "network: calls the live yfinance API (deselected by default; run with -m network)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "PT",   # pytest style
    "NPY",  # numpy
]
